<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Writing · Lección 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-body: #f0f4fc;
            --bg-body-gradient: linear-gradient(145deg, #f0f4fc 0%, #dce4f0 100%);
            --bg-container: rgba(255, 255, 255, 0.92);
            --shadow-container: 0 10px 30px -8px rgba(0, 20, 40, 0.20);
            --text-primary: #1a2639;
            --text-secondary: #3e4c66;
            --text-muted: #4a5d7a;
            --bg-card: #ffffff;
            --border-card: #e6edf8;
            --bg-input: #ffffff;
            --border-input: #d0dcee;
            --border-input-focus: #4f7bb3;
            --text-correct: #1f7a3e;
            --text-wrong: #b53a3a;
            --bg-success: rgba(31, 122, 62, 0.08);
            --bg-error: rgba(181, 58, 58, 0.08);
            --bg-number: #dfeaf9;
            --bg-footer-btn-hover: #d3e2fb;
            --border-footer: #c7d7ed;
            --bg-theme-btn: #ffffff;
            --border-theme-btn: #c8d4e6;
        }

        [data-theme="dark"] {
            --bg-body: #0d111a;
            --bg-body-gradient: linear-gradient(145deg, #0d111a 0%, #151e2b 100%);
            --bg-container: rgba(20, 26, 40, 0.92);
            --shadow-container: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
            --text-primary: #e8edf5;
            --text-secondary: #a8bcd8;
            --text-muted: #94aac9;
            --bg-card: #1a2336;
            --border-card: #2a3a54;
            --bg-input: #111b2c;
            --border-input: #334a6a;
            --border-input-focus: #5a82be;
            --text-correct: #6dca8a;
            --text-wrong: #e07070;
            --bg-success: rgba(109, 202, 138, 0.12);
            --bg-error: rgba(224, 112, 112, 0.12);
            --bg-number: #263a58;
            --bg-footer-btn-hover: #223a60;
            --border-footer: #2a3e5e;
            --bg-theme-btn: #1a2336;
            --border-theme-btn: #33455f;
        }

        body {
            background: var(--bg-body-gradient);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0.8rem;
            transition: background 0.3s;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-container);
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-container);
            transition: background 0.3s;
        }

        /* ===== HEADER COMPACTO ===== */
        .header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            border-bottom: 2px solid var(--border-footer);
            padding-bottom: 0.4rem;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        h1 small {
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-secondary);
            background: var(--bg-number);
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .stats-badge {
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-number);
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
        }

        .theme-toggle {
            background: var(--bg-theme-btn);
            border: 1.5px solid var(--border-theme-btn);
            border-radius: 40px;
            padding: 0.15rem 0.6rem 0.15rem 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .theme-toggle:hover {
            background: var(--bg-footer-btn-hover);
        }

        /* ===== TARJETAS COMPACTAS ===== */
        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0.8rem 0 0.3rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title span {
            font-size: 0.6rem;
            font-weight: 400;
            color: var(--text-muted);
            background: var(--bg-number);
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
        }

        .section-title .stats-badge {
            margin-left: auto;
        }

        .practice-grid {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .practice-card {
            background: var(--bg-card);
            border-radius: 0.5rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.2rem 0.4rem;
        }

        .practice-card:hover {
            border-color: var(--border-input-focus);
        }

        .practice-card.correct {
            border-left: 3px solid var(--text-correct);
            background: var(--bg-success);
        }

        .practice-card.wrong {
            border-left: 3px solid var(--text-wrong);
            background: var(--bg-error);
        }

        .number-badge {
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-number);
            width: 1.2rem;
            height: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 0.55rem;
            flex-shrink: 0;
        }

        .prompt-text {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-primary);
            min-width: 50px;
            flex: 0 1 auto;
            padding: 0.05rem 0.3rem;
            border-radius: 8px;
            border-left: 2px solid var(--border-card);
        }

        .prompt-text .es {
            font-weight: 300;
            color: var(--text-muted);
            font-size: 0.6rem;
        }

        .writing-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            min-width: 120px;
        }

        .writing-area textarea {
            flex: 1;
            padding: 0.15rem 0.4rem;
            border: 1.5px solid var(--border-input);
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: 'Segoe UI', monospace;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: 0.2s;
            resize: none;
            min-height: 28px;
            max-height: 60px;
            outline: none;
            line-height: 1.3;
        }

        .writing-area textarea:focus {
            border-color: var(--border-input-focus);
        }

        .writing-area textarea.correct {
            border-color: var(--text-correct);
            background: var(--bg-success);
        }

        .writing-area textarea.wrong {
            border-color: var(--text-wrong);
            background: var(--bg-error);
        }

        .btn-check {
            background: var(--bg-number);
            border: 1px solid var(--border-input);
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.55rem;
            transition: all 0.15s;
            font-family: inherit;
            height: 1.5rem;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-check:hover {
            background: var(--bg-footer-btn-hover);
        }

        .feedback-message {
            font-size: 0.6rem;
            padding: 0.05rem 0.4rem;
            border-radius: 20px;
            font-weight: 400;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feedback-message.empty {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .feedback-message.correct {
            color: var(--text-correct);
            background: var(--bg-success);
        }

        .feedback-message.wrong {
            color: var(--text-wrong);
            background: var(--bg-error);
        }

        .feedback-message.suggestion {
            color: var(--text-muted);
            background: var(--bg-number);
            font-size: 0.55rem;
            max-width: 200px;
        }

        /* ===== FOOTER COMPACTO ===== */
        .footer-tip {
            margin-top: 0.8rem;
            border-top: 1px solid var(--border-footer);
            padding-top: 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .footer-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
        }

        .footer-tip button {
            background: transparent;
            border: 1px solid var(--border-footer);
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.65rem;
            font-family: inherit;
        }

        .footer-tip button:hover {
            background: var(--bg-footer-btn-hover);
        }

        .next-btn {
            background: #2a4a7a !important;
            border: 2px solid #2a4a7a !important;
            color: #ffffff !important;
            padding: 0.2rem 1.2rem !important;
            font-weight: 600 !important;
        }

        .next-btn:hover {
            background: #1f3a6a !important;
        }

        .next-btn.completed {
            background: #1f7a3e !important;
            border-color: #1f7a3e !important;
        }

        .footer-info {
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container {
                padding: 0.6rem;
            }

            .practice-card {
                padding: 0.2rem 0.4rem;
                gap: 0.15rem;
            }

            .writing-area {
                flex-wrap: wrap;
                min-width: 100px;
            }

            .writing-area textarea {
                min-width: 60px;
                font-size: 0.65rem;
                min-height: 24px;
            }

            .prompt-text {
                font-size: 0.65rem;
                min-width: 40px;
            }

            .feedback-message {
                font-size: 0.55rem;
                max-width: 100px;
            }

            .btn-check {
                font-size: 0.5rem;
                height: 1.3rem;
                padding: 0.05rem 0.4rem;
            }

            h1 {
                font-size: 1rem;
            }

            .stats-badge {
                font-size: 0.55rem;
            }
        }

        @media (max-width: 400px) {
            .practice-card {
                flex-direction: column;
                align-items: stretch;
            }

            .number-badge {
                display: none;
            }

            .writing-area textarea {
                min-height: 30px;
            }

            .feedback-message {
                max-width: 100%;
                white-space: normal;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header-row">
        <h1>
            ✍️ English
            <small>Lección 1</small>
        </h1>
        <div class="header-right">
            <span class="stats-badge" id="progressStats">0 / 24</span>
            <button class="theme-toggle" id="themeToggle">
                <span id="themeIcon">☀️</span>
                <span id="themeLabel">Claro</span>
            </button>
        </div>
    </div>

    <!-- VOCABULARIO -->
    <div class="section-title">
        📚 Vocabulario
        <span>12</span>
        <span class="stats-badge" id="vocabStats">0/12</span>
    </div>
    <div class="practice-grid" id="vocabContainer"></div>

    <!-- FRASES -->
    <div class="section-title">
        🗣️ Frases
        <span>12</span>
        <span class="stats-badge" id="sentenceStats">0/12</span>
    </div>
    <div class="practice-grid" id="sentenceContainer"></div>

    <!-- FOOTER -->
    <div class="footer-tip">
        <div class="footer-buttons">
            <button id="clearAllBtn">🧹 Limpiar</button>
            <button id="showAllAnswersBtn">👀 Ver respuestas</button>
            <button id="checkAllBtn">✅ Verificar todo</button>
            <button class="next-btn" id="nextBtn">▶️</button>
        </div>
        <div class="footer-info">
            Enter para verificar · Doble clic en feedback para ver respuesta
        </div>
    </div>
</div>

<script>
    (function() {
        // ===== DATOS =====
        const vocabulary = [
            { spanish: "yo", english: "I" },
            { spanish: "tú", english: "You" },
            { spanish: "él", english: "He" },
            { spanish: "ella", english: "She" },
            { spanish: "ello", english: "It" },
            { spanish: "nosotros", english: "We" },
            { spanish: "ustedes", english: "You" },
            { spanish: "ellos", english: "They" },
            { spanish: "y", english: "and" },
            { spanish: "inglés", english: "English" },
            { spanish: "vivir", english: "to live" },
            { spanish: "hablar", english: "to talk" }
        ];

        const sentences = [
            { spanish: "nosotros aprendemos inglés", english: "We learn English." },
            { spanish: "helena come", english: "Helena eats." },
            { spanish: "él mira", english: "He looks." },
            { spanish: "yo trabajo", english: "I work." },
            { spanish: "henry escribe", english: "Henry writes." },
            { spanish: "ellos hablan", english: "They talk." },
            { spanish: "nosotros oímos", english: "We hear." },
            { spanish: "pedro y pablo hablan", english: "Pedro and Pablo talk." },
            { spanish: "usted lee", english: "You read." },
            { spanish: "ella trabaja", english: "She works." },
            { spanish: "nosotros firmamos", english: "We sign." },
            { spanish: "ellos trabajan", english: "They work." }
        ];

        // ===== ESTADO =====
        let vocabState = new Array(vocabulary.length).fill(false);
        let sentenceState = new Array(sentences.length).fill(false);
        let vocabCorrect = 0;
        let sentenceCorrect = 0;

        // ===== REFERENCIAS =====
        const vocabContainer = document.getElementById('vocabContainer');
        const sentenceContainer = document.getElementById('sentenceContainer');
        const vocabStats = document.getElementById('vocabStats');
        const sentenceStats = document.getElementById('sentenceStats');
        const progressStats = document.getElementById('progressStats');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const showAllBtn = document.getElementById('showAllAnswersBtn');
        const checkAllBtn = document.getElementById('checkAllBtn');
        const nextBtn = document.getElementById('nextBtn');

        let allCards = [];

        // ===== CORRECCIÓN =====
        function getCorrections(userInput, correctAnswer) {
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
            const userNorm = normalize(userInput);
            const correctNorm = normalize(correctAnswer);

            if (userNorm === correctNorm) {
                return { isCorrect: true, suggestions: [] };
            }

            if (userNorm === '') {
                return { isCorrect: false, suggestions: ['✏️ Escribe algo'] };
            }

            const suggestions = [];
            const userWords = userNorm.split(' ');
            const correctWords = correctNorm.split(' ');

            if (userWords.length < correctWords.length) {
                const missing = correctWords.slice(userWords.length);
                suggestions.push(`Falta: "${missing.join(' ')}"`);
            }

            if (userWords.length > correctWords.length) {
                const extra = userWords.slice(correctWords.length);
                suggestions.push(`Sobra: "${extra.join(' ')}"`);
            }

            // Comparación simple de palabras similares
            correctWords.forEach((cw, i) => {
                if (i < userWords.length && userWords[i] !== cw) {
                    if (getLevenshteinDistance(userWords[i], cw) <= 2) {
                        suggestions.push(`"${userWords[i]}" → "${cw}"`);
                    }
                }
            });

            if (suggestions.length === 0) {
                suggestions.push(`Correcto: "${correctAnswer}"`);
            }

            return { isCorrect: false, suggestions };
        }

        function getLevenshteinDistance(a, b) {
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    matrix[i][j] = b[i-1] === a[j-1] 
                        ? matrix[i-1][j-1] 
                        : Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
                }
            }
            return matrix[b.length][a.length];
        }

        // ===== CREAR TARJETA COMPACTA =====
        function createPracticeCard(item, index, type, state, updateStats) {
            const card = document.createElement('div');
            card.className = 'practice-card';
            card.dataset.index = index;

            const num = document.createElement('div');
            num.className = 'number-badge';
            num.textContent = index + 1;

            const prompt = document.createElement('div');
            prompt.className = 'prompt-text';
            prompt.innerHTML = `<span class="es">${item.spanish}</span>`;

            const area = document.createElement('div');
            area.className = 'writing-area';

            const textarea = document.createElement('textarea');
            textarea.placeholder = type === 'vocab' ? 'en inglés...' : 'traduce...';
            textarea.rows = 1;
            textarea.autocomplete = 'off';
            textarea.spellcheck = false;

            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });

            const checkBtn = document.createElement('button');
            checkBtn.className = 'btn-check';
            checkBtn.textContent = '✓';

            const feedback = document.createElement('div');
            feedback.className = 'feedback-message empty';
            feedback.textContent = '·';

            let suggestionEl = null;

            function verify() {
                const userAnswer = textarea.value.trim();
                const correctAnswer = item.english;

                if (userAnswer === '') {
                    feedback.textContent = '✏️';
                    feedback.className = 'feedback-message empty';
                    textarea.classList.remove('correct', 'wrong');
                    card.classList.remove('correct', 'wrong');
                    if (suggestionEl) { suggestionEl.remove(); suggestionEl = null; }
                    return;
                }

                const result = getCorrections(userAnswer, correctAnswer);
                textarea.classList.remove('correct', 'wrong');
                card.classList.remove('correct', 'wrong');
                feedback.className = 'feedback-message';

                if (suggestionEl) { suggestionEl.remove(); suggestionEl = null; }

                if (result.isCorrect) {
                    feedback.textContent = '✅';
                    feedback.className = 'feedback-message correct';
                    textarea.classList.add('correct');
                    card.classList.add('correct');
                    if (!state[index]) {
                        state[index] = true;
                        updateStats();
                    }
                } else {
                    feedback.textContent = '❌';
                    feedback.className = 'feedback-message wrong';
                    textarea.classList.add('wrong');
                    card.classList.add('wrong');
                    if (state[index]) {
                        state[index] = false;
                        updateStats();
                    }

                    if (result.suggestions.length > 0) {
                        suggestionEl = document.createElement('div');
                        suggestionEl.className = 'feedback-message suggestion';
                        suggestionEl.textContent = result.suggestions[0];
                        area.appendChild(suggestionEl);
                    }
                }
            }

            checkBtn.addEventListener('click', verify);

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    verify();
                }
            });

            feedback.addEventListener('dblclick', function() {
                this.textContent = `📖 ${item.english}`;
                this.className = 'feedback-message';
                this.style.color = 'var(--text-primary)';
            });

            area.appendChild(textarea);
            area.appendChild(checkBtn);
            area.appendChild(feedback);

            card.appendChild(num);
            card.appendChild(prompt);
            card.appendChild(area);

            const clear = () => {
                textarea.value = '';
                textarea.style.height = 'auto';
                textarea.classList.remove('correct', 'wrong');
                card.classList.remove('correct', 'wrong');
                feedback.textContent = '·';
                feedback.className = 'feedback-message empty';
                if (suggestionEl) { suggestionEl.remove(); suggestionEl = null; }
                if (state[index]) {
                    state[index] = false;
                    updateStats();
                }
            };

            const showAnswer = () => {
                textarea.value = item.english;
                textarea.style.height = 'auto';
                textarea.style.height = textarea.scrollHeight + 'px';
                verify();
            };

            return { card, clear, showAnswer, verify };
        }

        // ===== RENDERIZAR =====
        function renderAll() {
            vocabContainer.innerHTML = '';
            sentenceContainer.innerHTML = '';
            allCards = [];

            vocabulary.forEach((item, i) => {
                const { card, clear, showAnswer, verify } = createPracticeCard(
                    item, i, 'vocab', vocabState, updateVocabStats
                );
                vocabContainer.appendChild(card);
                allCards.push({ clear, showAnswer, verify });
            });

            sentences.forEach((item, i) => {
                const { card, clear, showAnswer, verify } = createPracticeCard(
                    item, i, 'sentence', sentenceState, updateSentenceStats
                );
                sentenceContainer.appendChild(card);
                allCards.push({ clear, showAnswer, verify });
            });

            updateVocabStats();
            updateSentenceStats();
            updateProgress();
        }

        // ===== ACTUALIZAR ESTADÍSTICAS =====
        function updateVocabStats() {
            vocabCorrect = vocabState.filter(v => v).length;
            vocabStats.textContent = `${vocabCorrect}/12`;
            updateProgress();
        }

        function updateSentenceStats() {
            sentenceCorrect = sentenceState.filter(v => v).length;
            sentenceStats.textContent = `${sentenceCorrect}/12`;
            updateProgress();
        }

        function updateProgress() {
            const total = vocabulary.length + sentences.length;
            const correct = vocabCorrect + sentenceCorrect;
            progressStats.textContent = `${correct}/${total}`;
            nextBtn.classList.toggle('completed', correct === total);
            nextBtn.textContent = correct === total ? '✅' : '▶️';
        }

        // ===== FUNCIONES GLOBALES =====
        function clearAll() {
            allCards.forEach(c => c.clear());
            vocabState.fill(false);
            sentenceState.fill(false);
            updateVocabStats();
            updateSentenceStats();
        }

        function showAllAnswers() {
            allCards.forEach(c => c.showAnswer());
        }

        function checkAll() {
            allCards.forEach(c => c.verify());
        }

        // ===== TEMA =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
            themeLabel.textContent = theme === 'dark' ? 'Oscuro' : 'Claro';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        function loadTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(saved || (prefersDark ? 'dark' : 'light'));
        }

        // ===== INICIALIZAR =====
        renderAll();
        loadTheme();

        themeToggle.addEventListener('click', toggleTheme);
        clearAllBtn.addEventListener('click', clearAll);
        showAllBtn.addEventListener('click', showAllAnswers);
        checkAllBtn.addEventListener('click', checkAll);

        nextBtn.addEventListener('click', function() {
            const total = vocabulary.length + sentences.length;
            const correct = vocabCorrect + sentenceCorrect;
            if (correct === total) {
                alert('🎉 ¡Completaste todos los ejercicios!');
            } else {
                alert(`📝 Te faltan ${total - correct} ejercicios.`);
            }
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) setTheme(e.matches ? 'dark' : 'light');
        });
    })();
</script>
</body>
</html>
